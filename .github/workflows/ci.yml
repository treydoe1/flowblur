# Tests and builds T Blur on an Apple Silicon runner, and checks the locked dependencies
# against the RustSec advisory database. Nothing here is signed with a Developer ID or
# notarized: releases are built locally with packaging/build_pkg.sh --notarize (see README).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays, for new advisories against unchanged lock files
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-build:
    name: Test and build (macOS arm64)
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/target
            plugin/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/Cargo.lock', 'plugin/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Test core
        working-directory: core
        run: cargo test --locked --release

      - name: Test plug-in
        working-directory: plugin
        run: cargo test --locked

      - name: Build plug-in bundle (ad-hoc signature)
        env:
          TBLUR_SIGN_IDENTITY: "-"
        run: plugin/build.sh

      - name: Build installer package (unsigned)
        env:
          TBLUR_INSTALLER_IDENTITY: "-"
        run: packaging/build_pkg.sh --no-build

  audit:
    name: Dependency audit
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked

      - name: Audit core
        working-directory: core
        run: cargo audit

      - name: Audit plug-in
        working-directory: plugin
        run: cargo audit
